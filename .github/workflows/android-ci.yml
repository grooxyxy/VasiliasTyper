name: VasiliasTyper CI (build di GitHub, bukan lokal)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Bundle bubble YOLOv8m (Drive default / secret)
        # Sumber (prioritas: BUBBLE_MODEL_PATH > BUBBLE_MODEL_URL > Drive default):
        # - BUBBLE_MODEL_URL = secret repo berisi link file
        #   comic-speech-bubble-detector.onnx (opsional).
        # - Bila secret kosong, task memakai Google Drive default milik user
        #   (ID 13B42NV0mPPBzUUVsIvD4SvE3QXEaLOlv, publik "Anyone with the link").
        # Model lain (LaMa/PP-OCR/ComicTextDetector) TIDAK dibundle — manual via
        # Hugging Face sesuai README assets/models. signing.properties TIDAK
        # diperlukan di CI (build memakai keystore debug bawaan AGP).
        env:
          BUBBLE_MODEL_URL: ${{ secrets.BUBBLE_MODEL_URL }}
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleBubbleModel --no-daemon --stacktrace

      - name: Unit test + Assemble debug
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: vasiliastyper-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Siapkan signing release (bila secret ada)
        # Release signed bila 4 secret ini diisi di Settings → Secrets → Actions:
        # RELEASE_KEYSTORE_BASE64 (base64 dari .jks), RELEASE_STORE_PASSWORD,
        # RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD. Bila kosong, release tetap
        # dirakit unsigned (app-release-unsigned.apk) — tetap bisa di-sign manual.
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/ci-release.jks
          printf 'releaseStoreFile=%s\nreleaseStorePassword=%s\nreleaseKeyAlias=%s\nreleaseKeyPassword=%s\n' \
            "ci-release.jks" "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" \
            > app/signing.properties

      - name: Assemble release
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK (release)
        uses: actions/upload-artifact@v4
        with:
          name: vasiliastyper-release-apk
          path: app/build/outputs/apk/release/*.apk
